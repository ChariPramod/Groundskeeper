[project]
name = "groundskeeper"
version = "0.1.0"
description = "Evidence-driven documentation maintenance"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "uvicorn>=0.35,<1",
]

[project.scripts]
groundskeeper = "groundskeeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/analysis/src/groundskeeper"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["services/analysis/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
